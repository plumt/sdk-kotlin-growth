org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1g
org.gradle.caching=true
kotlin.code.style=official
android.useAndroidX=true

# 배포 좌표 — 모듈별 artifactId 는 각 build.gradle.kts 의 coordinates 가 정한다
GROUP=net.plumt.growth

POM_URL=https://github.com/plumt/sdk-kotlin-growth
POM_LICENSE_NAME=The Apache License, Version 2.0
POM_LICENSE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENSE_DIST=repo
POM_SCM_URL=https://github.com/plumt/sdk-kotlin-growth
POM_SCM_CONNECTION=scm:git:git://github.com/plumt/sdk-kotlin-growth.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/plumt/sdk-kotlin-growth.git
POM_DEVELOPER_ID=plumt
POM_DEVELOPER_NAME=plumt
POM_DEVELOPER_URL=https://plumt.net

# BCV(binary-compatibility-validator)가 Kotlin 플러그인을 인식하도록 AGP 내장 Kotlin 을 끄고 kotlin-android 를 직접 적용한다
android.builtInKotlin=false
android.newDsl=false
